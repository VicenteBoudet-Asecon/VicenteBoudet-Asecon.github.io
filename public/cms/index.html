    <meta charset="utf-8" />

    <title>Editor de Novedades — Asecon</title>
    <link rel="icon" href="/favicon.svg" />
    <link href="config.yml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Versión exacta (no un rango ^3.0.0 flotante) + Subresource Integrity:
      este script tiene, vía Git Gateway, permiso de escritura sobre el
      repositorio. Un CDN comprometido o una versión nueva silenciosa ahí es
      la peor superficie de cadena de suministro del sitio. Al subir la
      versión, recalcular el hash con:
        curl -s https://unpkg.com/decap-cms@X.Y.Z/dist/decap-cms.js | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/decap-cms@3.1.6/dist/decap-cms.js"
      integrity="sha384-eoEJH4y4m0qh82Vrr15TJ5D8n6WkrX0NhbABU6gvqTwWQSNtV6WvCW9UxE+X7G/g"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
