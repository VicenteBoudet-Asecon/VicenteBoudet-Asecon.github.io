name: Deploy to production (manual) — Netlify

# Creado pero NO habilitado: solo corre si alguien lo dispara a mano desde
# la pestaña Actions (workflow_dispatch), nunca en push. El entorno
# "production" de abajo puede configurarse en Settings → Environments con
# revisores obligatorios — así el propio botón de "Run workflow" queda
# bloqueado hasta que alguien apruebe. Nada de esto corre solo mientras no
# se configure ese entorno y alguien lo dispare a propósito.
#
# Por qué Netlify y no Cloudflare Pages: el correo del estudio (Microsoft
# 365) vive en la misma zona DNS que el sitio, así que mover la zona es un
# riesgo que no vale la pena correr — y Cloudflare Pages **exige** que la
# zona esté en Cloudflare para servir el dominio raíz. Netlify sirve el
# apex con un solo registro A (75.2.60.5) desde el DNS actual, sin tocar
# ni un registro de correo. El preview (deploy-preview.yml) se queda en
# GitHub Pages tal cual, porque ya funciona y no depende de esto.
#
# **La integración git de Netlify no se usa** (ver netlify.toml): el
# despliegue sale de acá, donde `npm run validate` corre contra el dist/ ya
# armado antes de publicar. Un solo mecanismo, nunca dos.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "netlify-production"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment_url }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sin PREVIEW_SITE_URL: astro.config.mjs cae a https://aseconsa.com.
      # Los secrets quedan vacíos hasta que se cree el entorno "production" y
      # se carguen ahí — con ellos vacíos, cada canal construido en las
      # Fases 1 y 4 se sigue mostrando en su estado "sin activar" (ver
      # src/data/channels.js), nunca roto a medias.
      - name: Build (producción)
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
          PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.PUBLIC_TURNSTILE_SITEKEY }}
          PUBLIC_GSC_VERIFICATION: ${{ secrets.PUBLIC_GSC_VERIFICATION }}
        run: npm run build

      # A diferencia del preview, acá NO se sobrescribe robots.txt: el que
      # ya trae dist/ es el real (Disallow solo en /gracias, /en/thank-you,
      # /admin, /cms, /downloads), con el Sitemap apuntando al dominio real.
      - name: npm run validate (contra el dist/ de producción)
        run: npm run validate -- --no-build

      # NETLIFY_AUTH_TOKEN y NETLIFY_SITE_ID: secrets del entorno
      # "production" (Settings → Environments → production → Secrets). No
      # existen todavía, así que este paso falla de forma explícita hasta
      # que el sitio de Netlify esté creado — que es lo correcto: es
      # preferible a publicar en el lugar equivocado.
      #
      # Se usa el CLI con versión exacta en vez de una acción de terceros:
      # `npm ci` ya corre código de terceros en un runner con credenciales
      # de despliegue, y sumar una acción más es superficie que auditar. El
      # CLI de Netlify es la herramienta que de todos modos hay que confiar
      # para desplegar. Al subir la versión, subirla acá.
      #
      # --dir=dist publica el artefacto ya construido y validado arriba; no
      # se deja que Netlify compile por su cuenta (ver netlify.toml).
      - name: Deploy a Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          salida=$(npx --yes netlify-cli@27.8.1 deploy \
            --prod \
            --dir=dist \
            --functions=netlify/functions \
            --message="${GITHUB_SHA::7} desde Actions" \
            --json)
          url=$(printf '%s' "$salida" | jq -r '.url // .deploy_url // empty')
          if [ -z "$url" ]; then
            echo "El despliegue no devolvió una URL — revisa la salida del CLI." >&2
            exit 1
          fi
          echo "Publicado en $url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Contra la URL real ya desplegada, no contra dist/ local. Los tres
      # SMOKE_* reflejan qué activó ESTE despliegue puntual — hay que
      # ponerlos a mano al disparar el workflow si corresponde (ver el
      # checklist de activación, Fase 8). Por defecto asumen "todavía sin
      # activar" y fallan si encuentran lo contrario, que es justo lo que
      # detecta una activación accidental.
      #
      # La URL sale del propio despliegue, así que sirve igual antes y
      # después del corte de DNS (algo.netlify.app primero, aseconsa.com
      # después) sin tocar este archivo.
      - name: npm run smoke
        env:
          SMOKE_FORM_LIVE: ${{ vars.SMOKE_FORM_LIVE || '0' }}
          SMOKE_ADMIN_ENABLED: ${{ vars.SMOKE_ADMIN_ENABLED || '0' }}
          SMOKE_LEGAL_INDEXABLE: ${{ vars.SMOKE_LEGAL_INDEXABLE || '0' }}
        run: npm run smoke -- ${{ needs.build-and-deploy.outputs.deployment_url || 'https://aseconsa.com' }}
