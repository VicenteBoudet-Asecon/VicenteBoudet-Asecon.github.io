name: Deploy to production (manual) — Cloudflare Pages

# Creado pero NO habilitado: solo corre si alguien lo dispara a mano desde
# la pestaña Actions (workflow_dispatch), nunca en push. El entorno
# "production" de abajo puede configurarse en Settings → Environments con
# revisores obligatorios — así el propio botón de "Run workflow" queda
# bloqueado hasta que alguien apruebe. Nada de esto corre solo mientras no
# se configure ese entorno y alguien lo dispare a propósito.
#
# Reemplaza a la versión anterior de este archivo (GitHub Pages,
# actions/deploy-pages): con Cloudflare Pages elegido como hosting de
# producción (Fase 7), un solo mecanismo de despliegue basta — no tiene
# sentido mantener dos. El preview (deploy-preview.yml) se queda en GitHub
# Pages tal cual, porque ya funciona y no depende de esta decisión.
on:
  workflow_dispatch:

permissions:
  contents: read
  # Deja que wrangler-action cree un registro de GitHub Deployment (visible
  # en la pestaña Environments del repo) — puramente informativo, no afecta
  # el despliegue en sí.
  deployments: write

concurrency:
  group: "cloudflare-pages-production"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sin PREVIEW_SITE_URL: astro.config.mjs cae a https://aseconsa.com.
      # Los secrets quedan vacíos hasta que se cree el entorno "production" y
      # se carguen ahí — con ellos vacíos, cada canal construido en las
      # Fases 1 y 4 se sigue mostrando en su estado "sin activar" (ver
      # src/data/channels.js), nunca roto a medias.
      - name: Build (producción)
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
          PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.PUBLIC_TURNSTILE_SITEKEY }}
          PUBLIC_GSC_VERIFICATION: ${{ secrets.PUBLIC_GSC_VERIFICATION }}
        run: npm run build

      # A diferencia del preview, acá NO se sobrescribe robots.txt: el que
      # ya trae dist/ es el real (Disallow solo en /gracias, /en/thank-you,
      # /admin, /cms, /downloads), con el Sitemap apuntando al dominio real.
      - name: npm run validate (contra el dist/ de producción)
        run: npm run validate -- --no-build

      # CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID: secrets del entorno
      # "production" (Settings → Environments → production → Secrets), no
      # existen todavía. CLOUDFLARE_PAGES_PROJECT es una variable (no
      # secreta) con el nombre exacto del proyecto de Cloudflare Pages una
      # vez creado — mientras no se defina, cae a "asecon" como referencia,
      # que casi seguro habrá que corregir.
      - name: Deploy a Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'asecon' }}
            --branch=main

  smoke:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Contra la URL real ya desplegada, no contra dist/ local. Los dos
      # SMOKE_* reflejan si ESTE despliegue puntual activó el formulario y
      # /admin — hay que ponerlos a mano al disparar el workflow si
      # corresponde (ver el checklist de activación, Fase 8). Con el
      # dominio ya apuntando al proyecto de Cloudflare Pages, cambiar la URL
      # de respaldo de más abajo por https://aseconsa.com deja de hacer
      # falta: needs.build-and-deploy.outputs.deployment_url ya trae la URL
      # real de este despliegue (algo.pages.dev antes del corte de DNS).
      - name: npm run smoke
        env:
          SMOKE_FORM_LIVE: ${{ vars.SMOKE_FORM_LIVE || '0' }}
          SMOKE_ADMIN_ENABLED: ${{ vars.SMOKE_ADMIN_ENABLED || '0' }}
        run: npm run smoke -- ${{ needs.build-and-deploy.outputs.deployment_url || 'https://aseconsa.com' }}
