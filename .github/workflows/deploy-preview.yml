name: Deploy to GitHub Pages (preview)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PUBLIC_PREVIEW_CHANNELS=1 es lo que hace que WhatsApp, agendamiento y
      # la guía descargable se vean en su estado "maqueta" (visibles y
      # navegables con teclado, pero nunca como enlaces reales) en vez de no
      # renderizarse. Los tres estados se construyeron justamente para poder
      # revisar esa UX antes de tener los datos: sin esta variable, el
      # preview los muestra ausentes y no hay nada que revisar.
      #
      # Producción NO la define, y no debe hacerlo: ver deploy-production.yml.
      - name: Build (preview)
        env:
          PREVIEW_SITE_URL: https://vicenteboudet-asecon.github.io
          PUBLIC_PREVIEW_CHANNELS: '1'
        run: npm run build

      - name: Block search engines on this preview deploy
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      # Va DESPUÉS de sobrescribir robots.txt, no antes: scripts/validate.mjs
      # revisa dist/, que es lo que de verdad se va a publicar. Si se
      # validara antes de la reescritura, se estaría validando un artefacto
      # distinto del que sale a producción — exactamente el error que la
      # puerta existe para evitar.
      - name: npm run validate (contra el dist/ ya armado)
        env:
          PREVIEW_SITE_URL: https://vicenteboudet-asecon.github.io
          PUBLIC_PREVIEW_CHANNELS: '1'
        run: npm run validate -- --no-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
