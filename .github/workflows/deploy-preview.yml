name: Deploy to GitHub Pages (preview)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Global: solo lectura. Los permisos de publicar en Pages (pages + id-token)
# los tiene únicamente el job `deploy`, que no corre código de terceros; el
# job `build` (npm ci, Astro, Vite…) nunca los ve.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A nivel de job y no de paso: build y validate tienen que ver exactamente
    # las mismas variables, o se valida un artefacto distinto del que se armó.
    #
    # PUBLIC_PREVIEW_CHANNELS=1 es lo que hace que WhatsApp y la guía
    # descargable se vean en su estado "maqueta" (visibles y navegables con
    # teclado, pero nunca como enlaces reales) en vez de no renderizarse. Los
    # estados se construyeron justamente para poder revisar esa UX antes de
    # tener los datos: sin esta variable, el preview los muestra ausentes y no
    # hay nada que revisar.
    #
    # Producción NO la define, y no debe hacerlo: ver deploy-production.yml.
    env:
      PREVIEW_SITE_URL: https://vicenteboudet-asecon.github.io
      PUBLIC_PREVIEW_CHANNELS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (preview)
        run: npm run build

      - name: Block search engines on this preview deploy
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      # Va DESPUÉS de sobrescribir robots.txt, no antes: scripts/validate.mjs
      # revisa dist/, que es lo que de verdad se va a publicar. Si se
      # validara antes de la reescritura, se estaría validando un artefacto
      # distinto del que sale a producción — exactamente el error que la
      # puerta existe para evitar.
      - name: npm run validate (contra el dist/ ya armado)
        run: npm run validate -- --no-build

      # Desde v4, upload-pages-artifact deja fuera los archivos que empiezan
      # con punto. En dist/ son solo .nojekyll y los .gitkeep vacíos de
      # public/: con Pages desplegado desde Actions no corre Jekyll, así que
      # .nojekyll no hace falta y lo publicado no cambia.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Lo mínimo que pide deploy-pages, y solo en este job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
