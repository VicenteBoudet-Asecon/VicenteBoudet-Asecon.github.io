name: CI

# La puerta que no existía: hasta ahora, deploy-preview.yml compilaba y
# publicaba sin correr `npm run validate` ni una sola vez, y no corría en
# pull_request — un build que compila se publicaba igual, con el formulario
# roto o lo que fuera. Este workflow no despliega nada: solo valida.
on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: este workflow solo lee el repo, nunca escribe nada. El
# resultado del audit queda en el log del job; no se comenta en el PR ni en
# ninguna otra parte.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Sin credenciales de git guardadas en el runner: después del checkout
      # nada de este job necesita hablar con el repo.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22 en los tres workflows: Node 20 está fuera de soporte y el CLI
      # de Netlify que usa deploy-production.yml pide >=22.13. La misma
      # versión en todos, para que lo que valida CI sea lo que se publica.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compila y revisa el artefacto contra las reglas que el sitio no
      # puede romper (ver scripts/validate.mjs). Sale con código 1 si hay
      # alguna falla — eso es lo que bloquea el merge/push.
      - name: npm run validate
        run: npm run validate

      # Informativo, no bloquea: las vulnerabilidades de este proyecto son
      # todas de tiempo de build (la salida es HTML estático sin servidor).
      # El riesgo real es la cadena de suministro de CI, no el artefacto —
      # por eso las Actions de este repo van fijadas por SHA, no por tag.
      - name: npm audit (informativo)
        if: always()
        run: npm audit --audit-level=high || true
